
      <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle, #102c45, #020711 75%);
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

h1 {
  margin-top: 25px;
  letter-spacing: 5px;
  text-shadow: 0 0 15px #00eaff;
}

.subtitle {
  color: #83cfff;
  letter-spacing: 3px;
  font-size: 12px;
}

.reactor {
  width: 190px;
  height: 190px;
  margin: 35px auto;
  border: 5px solid #00dfff;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 20px #00dfff,
              inset 0 0 25px #00dfff;
  animation: pulse 2s infinite;
}

.reactor span {
  font-size: 65px;
  text-shadow: 0 0 20px #00eaff;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 45px #00eaff,
                inset 0 0 35px #00eaff;
  }
}

.status {
  color: #a5eaff;
  margin: 20px;
  font-size: 14px;
}

button {
  background: transparent;
  color: #00eaff;
  border: 1px solid #00eaff;
  border-radius: 25px;
  padding: 14px 25px;
  margin: 8px;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 0 10px #00bfff;
}

button:active {
  background: #007caa;
}

input {
  width: 90%;
  max-width: 420px;
  padding: 15px;
  border-radius: 25px;
  border: 1px solid #00eaff;
  background: #061727;
  color: white;
  outline: none;
  margin-top: 20px;
  font-size: 15px;
}

.response {
  border: 1px solid #007caa;
  border-radius: 15px;
  padding: 20px;
  margin: 25px auto;
  max-width: 450px;
  min-height: 80px;
  background: rgba(0, 30, 50, 0.7);
  color: white;
  line-height: 1.6;
}

.footer {
  margin-top: 40px;
  font-size: 11px;
  color: #478ca8;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S</h1>
<div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

<div class="reactor">
  <span>◈</span>
</div>

<div class="status" id="status">
  SYSTEM ONLINE
</div>

<button onclick="startListening()">🎤 ACTIVATE JARVIS</button>

<br>

<input
  id="command"
  type="text"
  placeholder="Enter your command..."
>

<button onclick="sendCommand()">SEND</button>

<div class="response" id="response">
  Hello! I am JARVIS. How may I assist you?
</div>

<div class="footer">
  J.A.R.V.I.S AI SYSTEM | VERSION 1.0
</div>

<script>

const statusText = document.getElementById("status");
const responseBox = document.getElementById("response");
const commandInput = document.getElementById("command");

function speak(text) {
  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speech.rate = 0.95;
  speech.pitch = 0.85;

  window.speechSynthesis.speak(speech);
}

function reply(text) {
  responseBox.innerText = text;
  speak(text);
}

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    reply("Voice recognition is not supported in this browser. Please use Chrome.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  statusText.innerText = "LISTENING...";

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    commandInput.value = text;
    processCommand(text);
  };

  recognition.onerror = function() {
    statusText.innerText = "VOICE ERROR";
    responseBox.innerText =
      "Please check your microphone permission and try again.";
  };

  recognition.onend = function() {
    statusText.innerText = "SYSTEM ONLINE";
  };

  recognition.start();
}

function sendCommand() {
  const text = commandInput.value.trim();

  if (text !== "") {
    processCommand(text);
  }
}

function processCommand(command) {

  const text = command.toLowerCase().trim();

  if (text.includes("hello") || text.includes("hey jarvis")) {
    reply("Hello! JARVIS systems are online. How can I help you?");
  }

  else if (text.includes("your name")) {
    reply("I am JARVIS, your personal AI assistant.");
  }

  else if (text.includes("time")) {
    reply("The current time is " +
      new Date().toLocaleTimeString());
  }

  else if (text.includes("date")) {
    reply("Today's date is " +
      new Date().toLocaleDateString());
  }

  else if (text.includes("open youtube")) {
    reply("Opening YouTube.");
    window.open("https://www.youtube.com", "_blank");
  }

  else if (text.includes("open google")) {
    reply("Opening Google.");
    window.open("https://www.google.com", "_blank");
  }

  else if (text.includes("open github")) {
    reply("Opening GitHub.");
    window.open("https://github.com", "_blank");
  }

  else if (text.startsWith("search")) {
    const query = text.replace("search", "").trim();

    if (query) {
      reply("Searching Google for " + query);
      window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
      );
    } else {
      reply("Please tell me what you want to search.");
    }
  }

  else if (text.includes("who are you")) {
    reply("I am JARVIS, your personal virtual assistant.");
  }

  else if (text.includes("thank you")) {
    reply("You're welcome. Always ready to assist.");
  }

  else if (text.includes("stop")) {
    window.speechSynthesis.cancel();
    reply("Voice output stopped.");
  }

  else {
    reply("I am still learning. Please try a supported command.");
  }
}

commandInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendCommand();
  }
});


let recognition;
let wakeMode = false;
let speaking = false;

function startListening() {
  const Speech =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Speech) {
    reply("Voice recognition is not supported.");
    return;
  }

  if (wakeMode) {
    wakeMode = false;
    recognition?.stop();
    statusText.innerText = "SYSTEM ONLINE";
    reply("Wake word mode disabled.");
    return;
  }

  recognition = new Speech();
  recognition.lang = "en-IN";
  recognition.continuous = true;
  recognition.interimResults = false;

  wakeMode = true;
  statusText.innerText = "LISTENING FOR JARVIS";

  recognition.onresult = function(event) {
    const result =
      event.results[event.results.length - 1][0].transcript;

    const text = result.toLowerCase().trim();

    if (text.includes("hey jarvis")) {
      const command = text.replace("hey jarvis", "").trim();

      if (command) {
        processCommand(command);
      } else {
        reply("Yes sir, I am listening.");
      }
    } else if (wakeMode) {
      statusText.innerText = "SAY HEY JARVIS";
    }
  };

  recognition.onend = function() {
    if (wakeMode && !speaking) {
      try {
        recognition.start();
      } catch (e) {}
    }
  };

  recognition.onerror = function() {
    statusText.innerText = "VOICE CONNECTION INTERRUPTED";
  };

  recognition.start();
}

function reply(message) {
  responseBox.innerText = message;

  speaking = true;
  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "en-IN";
  speech.pitch = 0.85;
  speech.rate = 0.95;

  speech.onend = function() {
    speaking = false;

    if (wakeMode) {
      try {
        recognition.start();
      } catch (e) {}
    }
  };

  window.speechSynthesis.speak(speech);
</script>
</body>
</html>

<button id="micBtn">
const micButton = document.getElementById("micButton");

if (micButton) {
    micButton.addEventListener("click", () => {
        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Speech recognition is not supported. Please use Chrome.");
            return;
        }

        const recognition = new SpeechRecognition();

        recognition.lang = "en-IN";
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micButton.textContent = "🔴 Listening...";
        };

        recognition.onresult = (event) => {
            const command =
                event.results[0][0].transcript;

            alert("JARVIS heard: " + command);

            const speech = new SpeechSynthesisUtterance(
                "I heard you. " + command
            );

            speech.lang = "en-IN";
            window.speechSynthesis.speak(speech);
        };

        recognition.onerror = (event) => {
            alert("Microphone error: " + event.error);
        };

        recognition.onend = () => {
            micButton.textContent = "🎤";
        };

        recognition.start();
    });
}
